# Barclays brand theme: the bank's cyan-and-navy identity, shared across the
# four demos so they read as one product suite. Barclays Navy (#00395D light /
# #1070A0 dark) drives buttons, links, and primary-badge fills, since it's dark
# enough for the white text they carry; Barclays Blue (#00AEEF) leads the logo,
# chart palette, and lighter accents, where that contrast rule doesn't apply.

[theme]
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
metricValueFontSize = "1.8rem"
metricValueFontWeight = 700
baseRadius = "0.5rem"
buttonRadius = "0.4rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#00395D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F7FA"
codeBackgroundColor = "#F2F7FA"
textColor = "#041E2E"
linkColor = "#00395D"
borderColor = "#DCE7ED"
codeTextColor = "#1E3744"
blueColor = "#00AEEF"
greenColor = "#16A34A"
yellowColor = "#CA8A04"
orangeColor = "#C2540C"
redColor = "#C72030"
violetColor = "#5B5BD6"
grayColor = "#5B6B74"
chartCategoricalColors = [
    "#00AEEF",
    "#00395D",
    "#00866F",
    "#C2540C",
    "#5B5BD6",
    "#B7791F",
    "#C72030",
    "#5B6B74",
]
chartSequentialColors = [
    "#E7F7FD",
    "#C7ECFA",
    "#9FDDF5",
    "#6FCBEF",
    "#3DB8E9",
    "#00AEEF",
    "#0092C9",
    "#00739C",
    "#00395D",
    "#002438",
]
dataframeBorderColor = "#DCE7ED"
dataframeHeaderBackgroundColor = "#F6FAFC"
dataframeHeaderTextColor = "#2F4954"

[theme.dark]
primaryColor = "#1070A0"
backgroundColor = "#041620"
secondaryBackgroundColor = "#0A2432"
codeBackgroundColor = "#0A2432"
textColor = "#E7F3F8"
linkColor = "#6FCBEF"
borderColor = "#163A48"
codeTextColor = "#C7DEE7"
blueColor = "#1FC1FF"
greenColor = "#34D399"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
redColor = "#F87171"
violetColor = "#A78BFA"
grayColor = "#8FA3AD"
chartCategoricalColors = [
    "#1FC1FF",
    "#5FA8C9",
    "#2BBBA3",
    "#E5833A",
    "#8B85F0",
    "#D3A13A",
    "#E5636F",
    "#8FA3AD",
]
chartSequentialColors = [
    "#031219",
    "#062233",
    "#0A3348",
    "#0D4760",
    "#115C79",
    "#147494",
    "#188CAF",
    "#3FA7D0",
    "#78C5E5",
    "#B4E2F2",
]
dataframeBorderColor = "#163A48"
dataframeHeaderBackgroundColor = "#071C27"
dataframeHeaderTextColor = "#9DB9C3"

[theme.light.sidebar]
backgroundColor = "#F6FAFC"
secondaryBackgroundColor = "#ECF4F7"
codeBackgroundColor = "#ECF4F7"
textColor = "#041E2E"
borderColor = "#DCE7ED"
primaryColor = "#00395D"
linkColor = "#00395D"

[theme.dark.sidebar]
backgroundColor = "#061B26"
secondaryBackgroundColor = "#0C2A38"
codeBackgroundColor = "#0C2A38"
textColor = "#E7F3F8"
borderColor = "#163A48"
primaryColor = "#1070A0"
linkColor = "#6FCBEF"

[global]
# The lever reset and scenario load callbacks assign the levers' keys, the
# documented way to change widgets that are bound to the URL. Streamlit still
# logs a "default value but also set via the Session State API" warning with a
# stack trace for that, so it is turned off here.
disableWidgetStateDuplicationWarning = true
